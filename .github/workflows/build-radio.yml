name: Build small Bigfish OLED
on:
  push:
    branches: ['codex/feiyu-small']
    paths: ['custom/radio-v1/MacroPad/**', 'custom/radio-v1/tests/**', 'custom/feiyu/host/**', '.github/workflows/build-radio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arduino/ArduinoCore-API
          path: core-api
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
      - name: Install matching board and libraries
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install rp2040:rp2040@6.3.1 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli lib install 'Simple FOC@2.3.5' 'U8g2@2.35.30' 'Adafruit NeoPixel@1.15.5' 'FastLED@3.9.15'
      - name: Test OLED rendering, buttons, SD, and memory
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I custom/radio-v1/MacroPad custom/radio-v1/tests/check_feiyu_screen.cpp -o /tmp/check-screen
          /tmp/check-screen
          python3 custom/radio-v1/tests/check_buttons.py
          g++ -std=c++17 -Wall -Wextra -Werror -I custom/radio-v1/MacroPad custom/radio-v1/tests/check_feiyu.cpp -o /tmp/check-feiyu
          /tmp/check-feiyu
          python3 -m unittest discover -s custom/feiyu/host -p 'test_bridge.py' -v
          g++ -std=c++17 -Wall -Wextra -Werror -I custom/radio-v1/MacroPad custom/radio-v1/tests/check_hud.cpp -o /tmp/check-hud
          /tmp/check-hud
          g++ -std=c++17 -Wall -Wextra -Werror -I custom/radio-v1/MacroPad custom/radio-v1/tests/check_number_macro.cpp -o /tmp/check-number
          /tmp/check-number
          python3 custom/radio-v1/tests/check_sd_storage.py core-api/api
          python3 -m unittest discover -s custom/sd-toolbox/tests -p 'test_*.py'
          node custom/sd-toolbox/tests/test_shortcuts.cjs
      - name: Compile RP2040 Plus 16 MB
        run: |
          arduino-cli compile --fqbn 'rp2040:rp2040:waveshare_rp2040_plus:flash=16777216_0,usbstack=tinyusb' --output-dir build/radio-v1 custom/radio-v1/MacroPad
          sha256sum build/radio-v1/*.uf2 > build/radio-v1/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Hapticpad-V1-CN-1.12.1-FEIYU
          path: build/radio-v1/
      - name: Store built UF2 on the isolated development branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = fs.readdirSync('build/radio-v1').find(x => x.endsWith('.uf2'));
            const data = fs.readFileSync('build/radio-v1/' + file);
            const path = 'custom/radio-v1/build/Hapticpad_V1_CN_1.12.1_FEIYU.uf2';
            const branch = context.ref.replace('refs/heads/', '');
            let sha;
            try { sha = (await github.rest.repos.getContent({...context.repo, path, ref: branch})).data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch, sha,
              message: 'Store Feiyu memory firmware build', content: data.toString('base64')});
            console.log('SHA256 ' + require('crypto').createHash('sha256').update(data).digest('hex'));
